<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Greeting & Clock Widget -->
  <section id="greeting" class="widget">
    <button id="btn-theme-toggle" aria-label="Toggle theme">🌙</button>
    <div id="greeting-text"></div>
    <div class="username-row">
      <input id="username-input" type="text" maxlength="50" placeholder="Your name…" aria-label="Enter your name" />
      <button id="btn-set-username">Set</button>
    </div>
    <div id="clock-display"></div>
    <div id="date-display"></div>
  </section>

  <!-- Focus Timer Widget -->
  <section id="timer" class="widget">
    <div id="timer-display"></div>
    <div class="timer-controls">
      <button id="btn-start">Start</button>
      <button id="btn-pause">Pause</button>
      <button id="btn-reset">Reset</button>
    </div>
  </section>

  <!-- To-Do List Widget -->
  <section id="todo" class="widget">
    <div class="todo-input-row">
      <input id="todo-input" type="text" maxlength="500" placeholder="Add a task…" />
      <button id="btn-add-todo">Add</button>
    </div>
    <p id="todo-validation" role="alert" style="display:none;"></p>
    <div class="sort-row">
      <label for="sort-select" class="sort-label">Sort:</label>
      <select id="sort-select" aria-label="Sort tasks">
        <option value="default">Default</option>
        <option value="az">A→Z</option>
        <option value="za">Z→A</option>
        <option value="done-last">Done last</option>
      </select>
    </div>
    <ul id="todo-list"></ul>
  </section>

  <!-- Quick Links Widget -->
  <section id="links" class="widget">
    <div class="links-input-row">
      <input id="link-name-input" type="text" maxlength="100" placeholder="Name" />
      <input id="link-url-input" type="text" maxlength="2048" placeholder="URL" />
      <button id="btn-add-link">Add</button>
    </div>
    <ul id="links-list"></ul>
  </section>

  <script defer src="js/app.js"></script>
</body>
</html>
